workflows:
  dinanath_android:
    name: Dinanath Jewellers Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --target=main.dart
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
