workflows:
  dinanath_ios:
    name: Dinanath Jewellers iOS
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Flutter platform projects
        script: |
          flutter create . --platforms=ios,android --project-name dinanath_jewellers
      - name: Get packages
        script: flutter pub get
      - name: Build iOS
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

  dinanath_android:
    name: Dinanath Jewellers Android
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter platform projects
        script: |
          flutter create . --platforms=ios,android --project-name dinanath_jewellers
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
